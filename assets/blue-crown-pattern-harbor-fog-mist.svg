<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800" role="img" aria-label="Blue Crown Properties brand pattern, Harbor Fog background, Mist marks">
<title>Blue Crown Properties - Brand Pattern (Harbor Fog, Mist marks)</title>
<desc>Light background version of the brand pattern using only palette colors: Mist (#DAEBF4) B marks, flat, on a Harbor Fog (#F2F8FC) field. The crown and smile cut-outs show the Harbor Fog field. To make it lighter, change the opacity on the b-marks group (1 = as designed). Seamless 400 x 800 tile; repeat edge to edge.</desc>
